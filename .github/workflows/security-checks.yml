name: Access checks
on: [pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check app.js
      - run: node --test tests/access.cjs tests/citas.test.cjs tests/history.test.cjs tests/billing.test.cjs tests/legal.test.cjs
      - run: node tests/patients.cjs
      - run: node tests/service-worker.cjs
